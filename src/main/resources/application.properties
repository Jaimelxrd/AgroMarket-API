spring.application.name=AgroMarket

# MySQL local (XAMPP). Credenciais podem ser substituídas via ambiente.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/agromarket_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Africa/Maputo}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Defina JWT_SECRET como uma chave Base64 com pelo menos 32 bytes aleatórios.
security.jwt.secret=${JWT_SECRET:}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:15}

app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# Bootstrap administrativo opcional. Mantido desativado por padrão.
agromarket.admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
agromarket.admin.bootstrap.nome=${ADMIN_NAME:}
agromarket.admin.bootstrap.email=${ADMIN_EMAIL:}
agromarket.admin.bootstrap.telefone=${ADMIN_PHONE:}
agromarket.admin.bootstrap.palavra-passe=${ADMIN_PASSWORD:}
